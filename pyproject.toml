[project]
name = "uao-neumonia"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "img2pdf>=0.6.3",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "python-xlib>=0.33",
    "tensorflow>=2.21.0",
    "tkcap>=0.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D203", "D213"]
